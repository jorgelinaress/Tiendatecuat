<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TecUat</title>
<style>

  /* --- Estilos generales --- */
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    color: #222;
  }

  /* --- Encabezado --- */
  header {
    background-color: #ffffff;
    border-bottom: 2px solid #ddd;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 22px;
    margin: 0;
  }

  #buscador {
    padding: 8px;
    width: 200px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  header button {
    background-color: #333;
    color: white;
    border: none;
    padding: 8px 12px;
    margin-left: 10px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* --- Sección de bienvenida --- */
  .bienvenida {
    text-align: center;
    padding: 30px 20px;
  }

  .bienvenida h2 {
    margin-bottom: 5px;
  }

  /* --- Cuadrícula de productos --- */
  .contenedor-productos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .producto {
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
  }

  .producto img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    margin-bottom: 10px;
  }

  .producto h3 {
    font-size: 16px;
    margin: 5px 0;
  }

  .producto .precio {
    font-weight: bold;
    color: #d35400;
    font-size: 18px;
  }

  .producto button {
    margin-top: 8px;
    background-color: #27ae60;
    color: white;
    border: none;
    padding: 8px;
    width: 100%;
    border-radius: 4px;
    cursor: pointer;
  }

  /* --- Ventana emergente (modal) reutilizable --- */
  .fondo-oscuro {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 10;
  }

  .ventana {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border-radius: 6px;
    z-index: 11;
    max-width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .ventana h2 {
    margin-top: 0;
  }

  .ventana .cerrar {
    float: right;
    cursor: pointer;
    font-size: 18px;
    background: none;
    border: none;
  }

  /* --- Detalle de producto --- */
  #detalleProducto {
    width: 350px;
  }

  #detalleProducto img {
    width: 100%;
    height: 200px;
    object-fit: contain;
  }

  /* --- Carrito --- */
  #ventanaCarrito {
    width: 320px;
  }

  .item-carrito {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding: 8px 0;
  }

  .item-carrito button {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }

  #totalCarrito {
    font-weight: bold;
    margin-top: 10px;
    text-align: right;
  }

  /* --- Login --- */
  #ventanaLogin input {
    display: block;
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  #ventanaLogin button {
    background: #333;
    color: white;
    border: none;
    padding: 8px;
    width: 100%;
    border-radius: 4px;
    cursor: pointer;
  }

</style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <h1>🖥️ TecUat</h1>
    <div>
      <input type="text" id="buscador" placeholder="Buscar producto...">
      <button onclick="buscarProducto()">Buscar</button>
      <button onclick="abrirLogin()" id="botonUsuario">Iniciar sesión</button>
      <button onclick="abrirCarrito()">🛒 Carrito (<span id="contadorCarrito">0</span>)</button>
    </div>
  </header>

  <!-- BIENVENIDA -->
  <section class="bienvenida">
    <h2>Accesorios de computadora</h2>
    <p>Encuentra mouse, teclados, audifonos y mas para tu equipo.</p>
  </section>

  <!-- PRODUCTOS -->
  <div class="contenedor-productos" id="contenedorProductos"></div>

  <!-- FONDO OSCURO PARA LAS VENTANAS -->
  <div class="fondo-oscuro" id="fondoOscuro" onclick="cerrarTodo()"></div>

  <!-- VENTANA: DETALLE DE PRODUCTO -->
  <div class="ventana" id="detalleProducto">
    <button class="cerrar" onclick="cerrarTodo()">✖</button>
    <div id="contenidoDetalle"></div>
  </div>

  <!-- VENTANA: CARRITO -->
  <div class="ventana" id="ventanaCarrito">
    <button class="cerrar" onclick="cerrarTodo()">✖</button>
    <h2>Carrito de compras</h2>
    <div id="listaCarrito"></div>
    <div id="totalCarrito"></div>
  </div>

  <!-- VENTANA: LOGIN -->
  <div class="ventana" id="ventanaLogin">
    <button class="cerrar" onclick="cerrarTodo()">✖</button>
    <h2>Iniciar sesión</h2>
    <input type="text" id="inputNombre" placeholder="Tu nombre">
    <input type="email" id="inputCorreo" placeholder="Tu correo">
    <button onclick="iniciarSesion()">Entrar</button>
  </div>

  // ==========================================
  // VARIABLES GLOBALES
  // ==========================================
  var carrito = [];      // aqui se guardan los productos agregados
  var usuario = null;    // aqui se guarda el usuario si inicia sesion

  // ==========================================
  // MOSTRAR LOS PRODUCTOS EN PANTALLA
  // ==========================================
  function mostrarProductos(lista) {
    var contenedor = document.getElementById("contenedorProductos");
    contenedor.innerHTML = "";

    for (var i = 0; i < lista.length; i++) {
      var p = lista[i];

      var div = document.createElement("div");
      div.className = "producto";
      div.onclick = (function(id) {
        return function () { verDetalle(id); };
      })(p.id);

      div.innerHTML =
        '<img src="' + p.imagen + '" alt="' + p.nombre + '">' +
        '<h3>' + p.nombre + '</h3>' +
        '<p>⭐ ' + p.calificacion + '</p>' +
        '<p class="precio">$' + p.precio + '</p>' +
        '<button onclick="event.stopPropagation(); agregarAlCarrito(' + p.id + ')">Agregar al carrito</button>';

      contenedor.appendChild(div);
    }
  }

  // Al cargar la pagina, mostramos todos los productos
  mostrarProductos(productos);

  // ==========================================
  // BUSCADOR
  // ==========================================
  function buscarProducto() {
    var texto = document.getElementById("buscador").value.toLowerCase();
    var resultado = [];

    for (var i = 0; i < productos.length; i++) {
      if (productos[i].nombre.toLowerCase().indexOf(texto) !== -1) {
        resultado.push(productos[i]);
      }
    }
    mostrarProductos(resultado);
  }

  // ==========================================
  // DETALLE DE PRODUCTO (como en Amazon)
  // ==========================================
  function verDetalle(id) {
    var p = buscarProductoPorId(id);
    if (!p) return;

    var html =
      '<img src="' + p.imagen + '" alt="' + p.nombre + '">' +
      '<h2>' + p.nombre + '</h2>' +
      '<p>⭐ ' + p.calificacion + '</p>' +
      '<p class="precio">$' + p.precio + '</p>' +
      '<p>' + p.descripcion + '</p>' +
      '<button onclick="agregarAlCarrito(' + p.id + ')">Agregar al carrito</button>';

    document.getElementById("contenidoDetalle").innerHTML = html;
    mostrarVentana("detalleProducto");
  }

  function buscarProductoPorId(id) {
    for (var i = 0; i < productos.length; i++) {
      if (productos[i].id === id) {
        return productos[i];
      }
    }
    return null;
  }

  // ==========================================
  // CARRITO DE COMPRAS
  // ==========================================
  function agregarAlCarrito(id) {
    var p = buscarProductoPorId(id);
    if (!p) return;

    // Revisamos si el producto ya esta en el carrito
    var yaExiste = false;
    for (var i = 0; i < carrito.length; i++) {
      if (carrito[i].id === id) {
        carrito[i].cantidad = carrito[i].cantidad + 1;
        yaExiste = true;
      }
    }

    if (!yaExiste) {
      carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, imagen: p.imagen, cantidad: 1 });
    }

    actualizarCarrito();
    alert("Se agrego: " + p.nombre);
  }

  function quitarDelCarrito(id) {
    var nuevoCarrito = [];
    for (var i = 0; i < carrito.length; i++) {
      if (carrito[i].id !== id) {
        nuevoCarrito.push(carrito[i]);
      }
    }
    carrito = nuevoCarrito;
    actualizarCarrito();
  }

  function actualizarCarrito() {
    // Actualizar el numero que aparece en el boton del carrito
    var totalUnidades = 0;
    for (var i = 0; i < carrito.length; i++) {
      totalUnidades = totalUnidades + carrito[i].cantidad;
    }
    document.getElementById("contadorCarrito").innerText = totalUnidades;

    // Dibujar la lista de productos en la ventana del carrito
    var lista = document.getElementById("listaCarrito");
    lista.innerHTML = "";

    if (carrito.length === 0) {
      lista.innerHTML = "<p>Tu carrito esta vacio.</p>";
    }

    var totalPagar = 0;
    for (var i = 0; i < carrito.length; i++) {
      var item = carrito[i];
      totalPagar = totalPagar + (item.precio * item.cantidad);

      var fila = document.createElement("div");
      fila.className = "item-carrito";
      fila.innerHTML =
        '<span>' + item.nombre + ' x' + item.cantidad + '</span>' +
        '<span>$' + (item.precio * item.cantidad) + '</span>' +
        '<button onclick="quitarDelCarrito(' + item.id + ')">Quitar</button>';
      lista.appendChild(fila);
    }

    document.getElementById("totalCarrito").innerText = "Total: $" + totalPagar;
  }

  function abrirCarrito() {
    mostrarVentana("ventanaCarrito");
  }

  // ==========================================
  // USUARIO (INICIAR / CERRAR SESION)
  // ==========================================
  function abrirLogin() {
    if (usuario !== null) {
      // si ya hay sesion iniciada, la cerramos
      usuario = null;
      document.getElementById("botonUsuario").innerText = "Iniciar sesión";
      alert("Sesion cerrada");
      return;
    }
    mostrarVentana("ventanaLogin");
  }

  function iniciarSesion() {
    var nombre = document.getElementById("inputNombre").value;
    var correo = document.getElementById("inputCorreo").value;

    if (nombre === "" || correo === "") {
      alert("Escribe tu nombre y correo");
      return;
    }

    usuario = { nombre: nombre, correo: correo };
    document.getElementById("botonUsuario").innerText = "Hola, " + nombre;
    cerrarTodo();
  }

  // ==========================================
  // MOSTRAR / CERRAR VENTANAS EMERGENTES
  // ==========================================
  function mostrarVentana(idVentana) {
    document.getElementById("fondoOscuro").style.display = "block";
    document.getElementById(idVentana).style.display = "block";
  }

  function cerrarTodo() {
    document.getElementById("fondoOscuro").style.display = "none";
    document.getElementById("detalleProducto").style.display = "none";
    document.getElementById("ventanaCarrito").style.display = "none";
    document.getElementById("ventanaLogin").style.display = "none";
  }

</script>
</body>
</html>
